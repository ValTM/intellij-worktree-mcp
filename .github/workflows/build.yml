name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'
      - name: Lint smoke client
        run: |
          pipx run --spec ruff==0.17.3 ruff check src/test/smoke.py
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: '9.3.1'
      - name: Download verified WebStorm SDK
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 3 -O https://download.jetbrains.com/webstorm/WebStorm-2026.2.3.tar.gz
          curl --fail --location --retry 3 -O https://download.jetbrains.com/webstorm/WebStorm-2026.2.3.tar.gz.sha256
          sha256sum --check WebStorm-2026.2.3.tar.gz.sha256
          mkdir webstorm-sdk
          tar -xzf WebStorm-2026.2.3.tar.gz -C webstorm-sdk --strip-components=1
      - name: Build, platform tests and compatibility
        shell: bash
        run: |
          xvfb-run --auto-servernum make build test compatibility \
            WEBSTORM="$RUNNER_TEMP/webstorm-sdk" \
            JBR="$RUNNER_TEMP/webstorm-sdk/jbr" \
            GRADLE="$(command -v gradle)"
      - name: Check release tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          test -f "build/distributions/intellij-worktree-mcp-${GITHUB_REF_NAME#v}.zip"
      - name: Upload plugin ZIP
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin
          path: build/distributions/*.zip
          if-no-files-found: error
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-reports
          path: |
            build/reports/
            build/test-results/
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plugin
          path: dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum ./*.zip > SHA256SUMS
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" ./*.zip SHA256SUMS --clobber
          else
            gh release create "$GITHUB_REF_NAME" ./*.zip SHA256SUMS --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
          fi
