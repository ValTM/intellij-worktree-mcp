name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Lint smoke client
        run: |
          pipx run --spec ruff==0.17.3 ruff check src/test/smoke.py
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '9.3.1'
      - name: Download verified WebStorm SDK
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 3 -O https://download.jetbrains.com/webstorm/WebStorm-2026.2.3.tar.gz
          curl --fail --location --retry 3 -O https://download.jetbrains.com/webstorm/WebStorm-2026.2.3.tar.gz.sha256
          sha256sum --check WebStorm-2026.2.3.tar.gz.sha256
          mkdir webstorm-sdk
          tar -xzf WebStorm-2026.2.3.tar.gz -C webstorm-sdk --strip-components=1
      - name: Build, platform tests and compatibility
        shell: bash
        run: |
          xvfb-run --auto-servernum make build test compatibility \
            WEBSTORM="$RUNNER_TEMP/webstorm-sdk" \
            JBR="$RUNNER_TEMP/webstorm-sdk/jbr" \
            GRADLE="$(command -v gradle)"
      - name: Check release tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          test -f "build/distributions/intellij-worktree-mcp-${GITHUB_REF_NAME#v}.zip"
      - name: Upload plugin ZIP
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: plugin
          path: build/distributions/*.zip
          if-no-files-found: error
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-reports
          path: |
            build/reports/
            build/test-results/
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: plugin
          path: dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum ./*.zip > SHA256SUMS
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" ./*.zip SHA256SUMS --clobber
          else
            gh release create "$GITHUB_REF_NAME" ./*.zip SHA256SUMS --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
          fi
