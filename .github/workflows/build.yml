name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check issue/project tracking policy
        run: make tracking-checks
      - name: Detect documentation and GitHub configuration changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          # Keep the required build check; only documentation/GitHub YAML changes skip work.
          echo "full=true" >> "$GITHUB_OUTPUT"
          case "$EVENT_NAME:$GITHUB_REF" in
            pull_request:*) comparison="$BASE_SHA...$HEAD_SHA" ;;
            push:refs/heads/main) comparison="$BASE_SHA..$HEAD_SHA" ;;
            *) exit 0 ;;
          esac
          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ || ! "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            exit 0
          fi
          # Missing history (including new branches/force pushes) fails closed.
          if ! git diff --no-ext-diff --no-renames --name-only -z "$comparison" -- > "$RUNNER_TEMP/changed-paths"; then
            exit 0
          fi
          [[ -s "$RUNNER_TEMP/changed-paths" ]] || exit 0
          # NUL delimiters handle all filenames; disabling renames includes deletions.
          while IFS= read -r -d '' path; do
            case "$path" in
              *.md|*.markdown|.github/*.yml|.github/*.yaml) ;;
              *) exit 0 ;;
            esac
          done < "$RUNNER_TEMP/changed-paths"
          echo "full=false" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        if: steps.changes.outputs.full != 'false'
        with:
          distribution: temurin
          java-version: '25'
      - name: Lint smoke client
        if: steps.changes.outputs.full != 'false'
        run: |
          pipx run --spec ruff==0.17.3 ruff check src/test/smoke.py .github/scripts
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        if: steps.changes.outputs.full != 'false'
        with:
          gradle-version: '9.3.1'
      - name: Download verified WebStorm SDK
        if: steps.changes.outputs.full != 'false'
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 3 -O https://download.jetbrains.com/webstorm/WebStorm-2026.2.3.tar.gz
          curl --fail --location --retry 3 -O https://download.jetbrains.com/webstorm/WebStorm-2026.2.3.tar.gz.sha256
          sha256sum --check WebStorm-2026.2.3.tar.gz.sha256
          mkdir webstorm-sdk
          tar -xzf WebStorm-2026.2.3.tar.gz -C webstorm-sdk --strip-components=1
      - name: Build, platform tests and compatibility
        if: steps.changes.outputs.full != 'false'
        shell: bash
        run: |
          xvfb-run --auto-servernum make build test compatibility \
            WEBSTORM="$RUNNER_TEMP/webstorm-sdk" \
            JBR="$RUNNER_TEMP/webstorm-sdk/jbr" \
            GRADLE="$(command -v gradle)"
      - name: Check release tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          test -f "build/distributions/intellij-worktree-mcp-${GITHUB_REF_NAME#v}.zip"
      - name: Upload plugin ZIP
        if: steps.changes.outputs.full != 'false'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin
          path: build/distributions/*.zip
          if-no-files-found: error
      - name: Upload verification reports
        if: always() && steps.changes.outputs.full != 'false'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-reports
          path: |
            build/reports/
            build/test-results/
          if-no-files-found: ignore

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plugin
          path: dist
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'
      - name: Download verified JetBrains ZIP signer
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 3 --output signer.jar \
            https://repo.maven.apache.org/maven2/org/jetbrains/marketplace-zip-signer/0.1.45/marketplace-zip-signer-0.1.45-cli.jar
          echo 'fc48b8a4165907e8164fc2a1256ed0d0fe6f7b25acb33ac48660ab13e7f64bb8  signer.jar' | sha256sum --check
      - name: Sign and verify release ZIP
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
        shell: bash
        run: |
          set -euo pipefail
          : "${PRIVATE_KEY:?Missing PRIVATE_KEY}" "${PRIVATE_KEY_PASSWORD:?Missing PRIVATE_KEY_PASSWORD}" "${CERTIFICATE_CHAIN:?Missing CERTIFICATE_CHAIN}"
          umask 077
          signing_dir="$(mktemp -d)"
          export SIGNING_DIR="$signing_dir"
          trap 'rm -rf "$signing_dir"' EXIT
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          for name in ("PRIVATE_KEY", "CERTIFICATE_CHAIN"):
              value = os.environ[name].strip()
              if not value.startswith("-----BEGIN "):
                  value = base64.b64decode(value, validate=True).decode("ascii")
              Path(os.environ["SIGNING_DIR"], name).write_text(value + "\n")
          PY
          archive="intellij-worktree-mcp-${GITHUB_REF_NAME#v}.zip"
          java -jar "$RUNNER_TEMP/signer.jar" sign \
            -in "dist/$archive" -out "$signing_dir/$archive" \
            -key-file "$signing_dir/PRIVATE_KEY" -key-pass "$PRIVATE_KEY_PASSWORD" \
            -cert-file "$signing_dir/CERTIFICATE_CHAIN"
          java -jar "$RUNNER_TEMP/signer.jar" verify \
            -in "$signing_dir/$archive" -cert "$signing_dir/CERTIFICATE_CHAIN"
          mv "$signing_dir/$archive" "dist/$archive"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum ./*.zip > SHA256SUMS
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" ./*.zip SHA256SUMS --clobber
          else
            gh release create "$GITHUB_REF_NAME" ./*.zip SHA256SUMS --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
          fi
      - name: Publish JetBrains Marketplace update
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          : "${PUBLISH_TOKEN:?Missing PUBLISH_TOKEN}"
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $PUBLISH_TOKEN" \
            --form 'xmlId=com.github.valtm.worktree.lifecycle' \
            --form "file=@dist/intellij-worktree-mcp-${GITHUB_REF_NAME#v}.zip" \
            https://plugins.jetbrains.com/api/updates/upload
