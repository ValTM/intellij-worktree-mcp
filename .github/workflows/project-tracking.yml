name: Project tracking

on:
  pull_request_target:
    branches: [main]
    types: [opened, edited, synchronize, reopened, closed, ready_for_review, converted_to_draft]
  issues:
    types: [opened, edited, reopened, closed, labeled, unlabeled, transferred, deleted]
  schedule:
    # Personal Project changes have no repository Actions event. Reconcile periodically.
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  enroll:
    if: github.event_name == 'issues' && github.event.action == 'opened'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Enroll new issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        run: python3 .github/scripts/project_tracking.py --enroll-only

  reconcile:
    needs: enroll
    if: always()
    # Coalesce reconciliation only; never drop an individual enrollment event.
    concurrency:
      group: project-tracking
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
      issues: read
      checks: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Only the protected default branch is trusted, even for fork PR events.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Reconcile issue, project and PR metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        run: python3 .github/scripts/project_tracking.py
